name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.50.1"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        working-directory: core
        run: cargo fmt --all --check
      - name: clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: core
        run: cargo test

  flutter-linux:
    name: Flutter (analyze, test, Linux build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build bridge library for FFI tests
        working-directory: core
        run: cargo build -p forensica_bridge
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: analyze
        working-directory: app
        run: flutter analyze
      - name: test
        working-directory: app
        run: flutter test
      - name: build linux
        working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: forensica-linux-x64
          path: app/build/linux/x64/release/bundle
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: build apk
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64,android-x64
      - name: check no INTERNET permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          if $AAPT dump permissions app/build/app/outputs/flutter-apk/app-debug.apk | grep -q android.permission.INTERNET; then
            echo "INTERNET permission found in release-bound manifest" && exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: forensica-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
