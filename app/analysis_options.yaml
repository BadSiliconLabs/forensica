include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/src/rust/**
    - lib/l10n/app_localizations*.dart
    - rust_builder/**
    - build/**
    - android/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
